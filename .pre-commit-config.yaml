# Catch a missing licence header before it is committed, rather than in CI
# after the fact.
#
#   pip install pre-commit && pre-commit install
#
# The hook STAMPS the staged files rather than just complaining. pre-commit then
# reports the files as modified and aborts the commit, so you re-stage and
# commit again -- the same flow as a formatter. Nothing is silently rewritten
# behind a commit you already approved.

repos:
  - repo: local
    hooks:
      - id: license-headers
        name: BUSL-1.1 licence header
        # Scope is intersected with `git ls-files` inside the script, so passing
        # filenames here can never reach vendored or untracked code.
        entry: python scripts/license_headers.py
        language: system
        pass_filenames: true
        require_serial: true
        # Types the stamper knows a comment syntax for. JSON is absent on
        # purpose: it has no comments.
        types_or: [python, javascript, ts, tsx, jsx, shell, sql, yaml, css, html, markdown]
