# Pull PREBUILT images from GHCR instead of building from source.
#
#   CITRA_VERSION=1.0.0 docker compose -f docker-compose.yml -f docker-compose.release.yml pull
#   CITRA_VERSION=1.0.0 docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --no-build
#   ./scripts/build-sandboxes.sh --pull        # pull the prebuilt sandbox/builder images too
#
# This override only adds `image:` to each service (merged on top of the base
# compose's `build:`), so `pull` fetches the published image and `up --no-build`
# runs it — no local build. Tag defaults to `latest`; pin a release with
# CITRA_VERSION. Override the registry/owner with CITRA_REGISTRY if you forked.
# See RELEASE.md. Plain `docker compose up` (build-from-source) is unchanged.
services:
  citra-service:             { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/citra-service:${CITRA_VERSION:-latest}" }
  citra-ui:                  { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/citra-ui:${CITRA_VERSION:-latest}" }
  citra-user-service:        { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/citra-user-service:${CITRA_VERSION:-latest}" }
  duckdb-query-service:      { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/duckdb-query-service:${CITRA_VERSION:-latest}" }
  reranker-service:          { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/reranker-service:${CITRA_VERSION:-latest}" }
  discovery-service:         { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/discovery-service:${CITRA_VERSION:-latest}" }
  action-sandbox-host:       { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/action-sandbox-host:${CITRA_VERSION:-latest}" }
  smart-app-service:         { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/smart-app-service:${CITRA_VERSION:-latest}" }
  citra-app-runtime:         { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/citra-app-runtime:${CITRA_VERSION:-latest}" }
  data-discovery-service:    { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/data-discovery-service:${CITRA_VERSION:-latest}" }
  citra-mcp-service:         { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/citra-mcp-service:${CITRA_VERSION:-latest}" }
  playwright-render-service: { image: "${CITRA_REGISTRY:-ghcr.io/trustedwear-tech}/playwright-render-service:${CITRA_VERSION:-latest}" }
