[project]
name = "citra-decision-api"
version = "0.1.0"
description = "Python SDK for the Citra Decision API — drive a headless Decision App (recommend -> approve/override -> fraud -> feedback -> learning) from desktop apps, automations, or backend services."
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
license = { text = "UNLICENSED" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["decision_app"]
