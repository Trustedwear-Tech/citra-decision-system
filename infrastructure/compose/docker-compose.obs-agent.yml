# =============================================================================
# Citra — Observability Agent (for non-obs boxes)
# =============================================================================
# ⚠️ DO NOT DELETE — dormant in demo-prod, REQUIRED in the customer topology.
# Demo-prod is one box (Citra-AI-1) which hosts the obs stack itself and is
# scraped directly, so this agent has no target today. Every additional box in
# the customer topology (Common box, scale boxes) needs it to be observable at
# all. See docs/deployment-topology.md.
#
# Runs on boxes that do NOT host the central observability stack but still need
# to be observed. Provides:
#
#   * node-exporter  — host CPU/mem/disk/net metrics, published on :9100 for
#                      the central Prometheus (on the app box) to scrape.
#   * promtail       — ships this box's Docker logs to the central Loki.
#
# The central Prometheus/Loki live on the app box (Citra-AI-1). Point this
# agent at it via env vars (see .env.obs-agent, generated by the deploy script):
#
#   LOKI_PUSH_HOST   private IP of the app box   (e.g. 172.31.39.51)
#   OBS_HOST_LABEL   label for this box's logs   (e.g. citra-common)
#
#   docker compose -f docker-compose.obs-agent.yml --env-file .env.obs-agent up -d
# =============================================================================

version: "3.8"

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: citra-node-exporter
    restart: unless-stopped
    logging: *json-logging
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"   # scraped by central Prometheus at <this-box-ip>:9100

  promtail:
    image: grafana/promtail:3.1.1
    container_name: citra-promtail-agent
    restart: unless-stopped
    logging: *json-logging
    command:
      - "-config.file=/etc/promtail/promtail-agent-config.yml"
      - "-config.expand-env=true"
    environment:
      LOKI_PUSH_HOST: ${LOKI_PUSH_HOST}
      OBS_HOST_LABEL: ${OBS_HOST_LABEL:-citra-common}
    volumes:
      - ./observability/promtail-agent-config.yml:/etc/promtail/promtail-agent-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_agent_positions:/tmp

volumes:
  promtail_agent_positions:
