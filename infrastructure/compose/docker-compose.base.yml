# =============================================================================
# Citra AI — Base Compose (shared config, network, logging)
# =============================================================================
# This file defines shared YAML anchors and the external network.
# All modular compose files reference the citra-network.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5

networks:
  citra-network:
    external: true
