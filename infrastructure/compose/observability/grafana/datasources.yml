apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # When a log line contains "trace_id=<hex>", show a clickable link to
      # the matching Tempo trace. Lets you jump log → trace in one click.
      derivedFields:
        - name: trace_id
          matcherRegex: "trace_id=([a-f0-9]+)"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # When viewing a Tempo trace, show "Logs for this span" button that
      # queries Loki for the corresponding service over the span window.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service
      lokiSearch:
        datasourceUid: loki
