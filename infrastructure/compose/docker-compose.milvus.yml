# =============================================================================
# Citra AI — Milvus Module (vector database + etcd + internal MinIO)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: citra-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    networks:
      - citra-network
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      test: ["CMD", "etcdctl", "endpoint", "health"]
    logging: *default-logging

  milvus-minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: citra-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /data --console-address ":9001"
    networks:
      - citra-network
    volumes:
      - milvus_minio_data:/data
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: citra-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      # Must match milvus-minio's root creds above (defaults to minioadmin in
      # dev). Parameterized so a prod override stays in sync on both sides.
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - citra-network
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
    logging: *default-logging

volumes:
  milvus_etcd_data:
    driver: local
  milvus_minio_data:
    driver: local
  milvus_data:
    driver: local

networks:
  citra-network:
    external: true
