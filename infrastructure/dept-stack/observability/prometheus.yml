# =============================================================================
# Per-dept Prometheus (agent mode)
# =============================================================================
# Scrapes local dept services, adds dept / org labels to every sample, and
# remote_writes to the central Prometheus. No long-term storage on the dept
# host — 2h TSDB buffer just smooths central outages.
# =============================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    dept: ${DEPT_ID}
    org:  ${ORG_ID}

remote_write:
  - url: ${CENTRAL_PROMETHEUS_URL}
    queue_config:
      capacity: 2500
      max_samples_per_send: 500

scrape_configs:
  - job_name: dept-mcp
    static_configs:
      - targets: ["dept-${DEPT_ID}-mcp:8090"]
        labels: {component: dept-mcp}

  - job_name: citra-service
    metrics_path: /citra-ai/metrics
    static_configs:
      - targets: ["dept-${DEPT_ID}-citra-service:7001"]
        labels: {component: citra-service}

  - job_name: milvus
    static_configs:
      - targets: ["dept-${DEPT_ID}-milvus:9091"]
        labels: {component: milvus}

  - job_name: node-exporter
    static_configs:
      - targets: ["dept-${DEPT_ID}-node-exporter:9100"]
        labels: {component: node-exporter}
