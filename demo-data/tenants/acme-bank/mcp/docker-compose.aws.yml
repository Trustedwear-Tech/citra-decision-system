# citra-ds-mcp-demo-acme-bank — AWS variant of docker-compose.yml for the Citra-AI-Common box.
#
# Identical to docker-compose.yml EXCEPT it runs a prebuilt image instead of
# `build:` — the AWS boxes are not git checkouts and cannot build from the
# monorepo root. The image is built on the operator laptop
# (`docker build -f source-mcp-template/Dockerfile -t citra-ds-mcp-demo-acme-bank:aws .`
# from the monorepo root), `docker save`d, shipped to the box via S3, and
# `docker load`ed before this compose runs. See scripts/bootstrap-mcp-demo-acme-bank-vault.ps1.
#
# CONFIG COMES FROM VAULT (prod model — same as every Citra prod service):
# the full bag (CITRA_MONGO_URI/_DB, JWT_SECRET, MCP_API_KEY, Milvus /
# embedding / LLM keys, S3 creds, DISCOVERY_URL, MCP_PUBLIC_BASE_URL, …)
# lives at Vault path `prod/citra-ds-mcp-demo-acme-bank` and is loaded at boot by
# source-mcp-template/vault_bootstrap.py (AppRole, read-only). The only
# secret on the box is the mode-600 `.vault_secret` env_file carrying
# VAULT_SECRET_ID, minted by scripts/bootstrap-mcp-demo-acme-bank-vault.ps1.
# NO secret-bearing .env is shipped to the box anymore. LOCAL dev
# (docker-compose.yml) keeps the .env model — Vault is prod-only.
#
# Vault loads ONLY at container startup — after changing the bag, recreate:
#   docker compose -f docker-compose.aws.yml up -d --force-recreate citra-ds-mcp-demo-acme-bank
#
# Usage on the box (done by bootstrap-mcp-demo-acme-bank-vault.ps1 over SSM):
#   docker compose -f docker-compose.aws.yml up -d citra-ds-acme-bank-postgres
#   <seed Postgres>
#   docker compose -f docker-compose.aws.yml up -d citra-ds-mcp-demo-acme-bank
#   curl http://localhost:8503/health

name: citra-ds-acme-bank-demo
services:

  citra-ds-mcp-demo-acme-bank:
    # Generic source-mcp-template image, built in CI and pulled from GHCR like
    # every other service — `docker compose pull && up -d`. (Replaces the old
    # build-on-laptop + docker-save + S3-ship + docker-load path; no bucket
    # creds needed.) Tenant config comes from the env block + Vault + the
    # mounted SOURCES_FILE (sources.json) at runtime, so the image stays generic.
    image: ghcr.io/trustedwear-tech/citra-ai/source-mcp-template:${IMAGE_TAG:-prod-latest}
    container_name: citra-ds-mcp-demo-acme-bank
    restart: unless-stopped
    ports:
      - "18504:8090"
    depends_on:
      - citra-ds-acme-bank-postgres
    networks:
      - acme-bank-demo
      # Co-located Citra services (incl. the Vault container) live on
      # citra-network; the MCP joins it to reach vault:8200 + discovery.
      - citra-network
    # VAULT_SECRET_ID only — minted by scripts/bootstrap-mcp-demo-acme-bank-vault.ps1.
    # Everything else secret comes from the Vault bag at boot.
    env_file:
      - .vault_secret
    volumes:
      # The source registry (SOURCES_FILE). sources.json is generated by
      # scripts/build_mcp_sources.py and SHIPPED to the box next to this compose
      # by bootstrap-mcp-demo-acme-bank-vault.ps1 (like .vault_secret). Mounted read-only.
      - ./sources.json:/app/sources.json:ro
    environment:
      # ── Identity (static — compose wins over the Vault bag) ──────────
      ORG_ID: acme-bank
      DEPT_IDS: "lending,collections,claims,sales_distribution,central_ops"
      ENVIRONMENT: demo

      # ── Vault (PROD config source) ───────────────────────────────────
      # vault_bootstrap.py logs in with AppRole (role_id below is stable
      # and non-secret; secret_id comes from .vault_secret) and loads the
      # whole bag — JWT_SECRET, MCP_API_KEY, MILVUS_*, EMBEDDING_*, LLM_*,
      # DISCOVERY_URL, MCP_PUBLIC_BASE_URL, BUCKET_*, SENTRY_* — into the
      # process env BEFORE config.py reads it. The MCP holds NO Citra DB
      # credentials: the source registry is the mounted SOURCES_FILE and audit
      # is POSTed to SMART_APP_SERVICE_URL (below). Drop CITRA_MONGO_URI/_DB
      # from the Vault bag. Fails loud if Vault is unreachable or the bag empty.
      # Portable default = the co-located Vault container (service DNS).
      # Override with a VAULT_ADDR env var for a different topology.
      VAULT_ADDR: "${VAULT_ADDR:-http://vault:8200}"
      VAULT_ROLE_ID: "1b6401b8-2b84-68d6-93bf-ddbfb4570c30"
      VAULT_SECRET_PATH: prod/citra-ds-mcp-demo-acme-bank

      # ── Static (non-secret) config ───────────────────────────────────
      # Source registry — the mounted sources.json (see `volumes:` above).
      SOURCES_FILE: /app/sources.json
      # Audit ingest — POST to smart-app-service (sole writer of dept_query_audit).
      # The prod container's citra-network alias is smart-app-service-prod:9100.
      # NB: vault_bootstrap uses overwrite=False (compose env wins), so the
      # correct host MUST be set here, not in the Vault bag.
      SMART_APP_SERVICE_URL: ${SMART_APP_SERVICE_URL:-http://smart-app-service-prod:9100}
      MILVUS_VECTOR_DIM: "768"
      MILVUS_COLLECTION_PREFIX: demo_acme_bank
      # GLM-class reasoning models: keep reasoning OUT of the response so
      # the generated SQL lands in `content`.
      LLM_EXTRA_BODY: '{"reasoning":{"exclude":true}}'
      LLM_PLANNER_MAX_TOKENS: "2048"
      LLM_PLANNER_MAX_RETRIES: "3"
      # Fail-closed authz; JWT_SECRET arrives from the Vault bag.
      AUTHZ_ENFORCE: "true"
      DOCUMENT_URL_TTL_SECONDS: "300"

      # ── Postgres (the 4 structured sources; sibling container) ───────
      PYTHONPATH: "/app/source-mcp-template"
      ACME_BANK_SQL_HOST: "citra-ds-acme-bank-postgres"
      ACME_BANK_SQL_PORT: "5432"
      ACME_BANK_SQL_DB: "acme_bank"
      ACME_BANK_SQL_USER: "acme_bank"
      ACME_BANK_SQL_PASS: "acme_bank_demo_pw"

      PORT: "8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  citra-ds-acme-bank-postgres:
    image: postgres:16-alpine
    container_name: citra-ds-acme-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acme_bank
      POSTGRES_USER: acme_bank
      POSTGRES_PASSWORD: acme_bank_demo_pw
    ports:
      - "15444:5432"
    volumes:
      - acme-bank-pgdata:/var/lib/postgresql/data
    networks:
      - acme-bank-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_bank"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Shared Citra network (Vault, discovery, etc.) — created by the Citra
  # platform stack; the MCP attaches to it for vault:8200 + discovery.
  citra-network:
    external: true
  acme-bank-demo:
    driver: bridge
    name: acme-bank-demo

volumes:
  acme-bank-pgdata:
