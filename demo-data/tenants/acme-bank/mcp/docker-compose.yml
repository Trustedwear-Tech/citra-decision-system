# acme-bank demo — tenant data plane: Postgres + the demo MCP.
#
# The MCP reads its source registry from the LOCAL sources.json mounted at
# /app/sources.json (SOURCES_FILE) and publishes those sources to discovery on
# boot. There is no import step — regenerate the file and restart this service.
#
# Explicit project name so this cannot collide with the acme-power /
# acme-cement / bihar-gov demo stacks.
#
# Prereqs:
#   1. docker compose up -d citra-ds-acme-bank-postgres
#      <Citra-Service venv>/python.exe ../scripts/seed_postgres.py
#   2. python ../scripts/build_mcp_sources.py     → writes sources.json
#   3. cp .env.example .env  and fill in the secrets
#
# Usage:
#   docker compose up -d --build citra-ds-mcp-demo-acme-bank
#   curl http://localhost:18504/health      # must list 5 sources
#   docker compose down            # keeps the volume
#   docker compose down -v         # destroys the seeded data
# The project name is SCOPED TO THIS CHECKOUT, and required rather than
# defaulted. It used to be the literal `citra-ds-acme-bank-demo`, which made
# this Postgres volume shared by every checkout of this repo on the machine --
# so `wizard.sh --fresh` in one tree silently destroyed the seeded demo in
# another. Every other volume here is project-scoped; this one was not.
#
# Required, not defaulted, because a default would silently split the data in
# two: an invocation that forgot --env-file would address a DIFFERENT project,
# create a second empty volume, and report a healthy stack over no data.
# setup.sh writes this into .env; run every compose here with --env-file.
name: ${CITRA_DEMO_PROJECT:?set CITRA_DEMO_PROJECT (setup.sh writes it into .env) and pass --env-file <repo>/.env}
services:

  citra-ds-mcp-demo-acme-bank:
    build:
      # Monorepo root — the Dockerfile COPYs citra-service-utils/ AND
      # source-mcp-template/, so the context must be the parent of both.
      # This compose lives four levels below the root.
      context: ../../../../
      dockerfile: source-mcp-template/Dockerfile
    image: citra-mcp-demo-acme-bank
    container_name: citra-ds-mcp-demo-acme-bank
    restart: unless-stopped
    depends_on:
      - citra-ds-acme-bank-postgres
    ports:
      # 8503 is acme-power's.
      - "18504:8090"
    networks:
      - citra-network
    volumes:
      # The source registry, generated by scripts/build_mcp_sources.py.
      # Read-only: the MCP consumes it, nothing writes it back.
      - ./sources.json:/app/sources.json:ro
    environment:
      # ── Identity ─────────────────────────────────────────────────────
      ORG_ID: acme-bank
      # MUST include central_ops, or the cross-dept acme_bank_policy_library
      # source is silently skipped: the router filters dept_id $in DEPT_IDS and
      # the policy library carries dept_id="central_ops" verbatim. Dropping it
      # would leave the 4 structured sources loaded and every app ungrounded.
      DEPT_IDS: "lending,collections,claims,sales_distribution,central_ops"
      ENVIRONMENT: demo

      # ── Source registry ──────────────────────────────────────────────
      SOURCES_FILE: /app/sources.json

      # ── Audit ingest ─────────────────────────────────────────────────
      # Audit records are POSTed to smart-app-service (the sole writer of
      # dept_query_audit) — the MCP holds NO Citra DB credentials.
      SMART_APP_SERVICE_URL: ${SMART_APP_SERVICE_URL:-http://smart-app-service:9100}

      # ── Milvus (RAG /query) ──────────────────────────────────────────
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_VECTOR_DIM: "768"
      MILVUS_COLLECTION_PREFIX: demo_acme_bank

      # ── Embeddings ───────────────────────────────────────────────────
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-not-needed}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-0}

      RERANKER_URL: ${RERANKER_URL:-}

      # ── LLM (NL→SQL planner) ─────────────────────────────────────────
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-fake-llm}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed}
      PLANNER_ENABLED: ${PLANNER_ENABLED:-true}
      # Reasoning models must keep reasoning OUT of the response or the SQL
      # never lands in `content` and the planner crashes on content=null.
      LLM_EXTRA_BODY: '{"reasoning":{"exclude":true}}'
      LLM_PLANNER_MAX_TOKENS: ${LLM_PLANNER_MAX_TOKENS:-2048}
      LLM_PLANNER_MAX_RETRIES: ${LLM_PLANNER_MAX_RETRIES:-3}

      # ── Discovery ────────────────────────────────────────────────────
      # Service name on citra-network. Was host.docker.internal:9010 while
      # this MCP ran on its own network and could not resolve one.
      DISCOVERY_URL: ${DISCOVERY_URL:-http://discovery-service:9000}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be set; never default it in a shared env}
      # Advertised to discovery-service as this MCP's crawlable base_url, so it
      # must be reachable BY data-discovery-service — a container. Service name,
      # container port: 'localhost' would resolve to the crawler itself.
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://citra-ds-mcp-demo-acme-bank:8090}

      # ── AuthZ (fail-closed) ──────────────────────────────────────────
      # Verifies the forwarded X-User-JWT against Citra's shared HS256 secret,
      # then runs the visibility PDP. There is NO RS256/JWKS path.
      AUTHZ_ENFORCE: ${AUTHZ_ENFORCE:-true}
      JWT_SECRET: ${JWT_SECRET:-}

      # ── Object storage (signed /document_url handoffs) ───────────────
      # ACME_BANK_BUCKET, deliberately NOT ${BUCKET_NAME}. This defaulted to
      # `demo-source-citra` and never once applied: BUCKET_NAME is set in the
      # root .env for the PLATFORM's bucket, so compose substituted that and
      # every claim document landed in citra-documents beside Citra's own
      # tree. These are the bank's system-of-record artefacts, referenced from
      # the bank's own Postgres — in a real deployment they sit in the
      # customer's bucket under the customer's credentials, and Citra's
      # storage is somewhere else entirely. A shared bucket teaches the
      # opposite, quietly. The SOP library legitimately stays platform-side:
      # it is a Citra dept library, indexed in Citra's Milvus.
      BUCKET_NAME: ${ACME_BANK_BUCKET:-acme-bank-source}
      BUCKET_REGION: ${BUCKET_REGION:-ap-south-1}
      BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY:-}
      BUCKET_SECRET_KEY: ${BUCKET_SECRET_KEY:-}
      # Hardcoded, NOT ${BUCKET_ENDPOINT_URL:-}, for the same cross-network
      # reason as DISCOVERY_URL and MCP_PUBLIC_BASE_URL above. The root .env
      # sets this to http://citra-minio:9000 — correct for services on
      # citra-network, unresolvable from this MCP's isolated acme-bank-demo
      # network. Inheriting it makes every signed /document_url handoff fail
      # on DNS. The host-published port is the one route that works here, and
      # it tracks MINIO_API_PORT so an override stays in step on both sides.
      BUCKET_ENDPOINT_URL: ${BUCKET_ENDPOINT_URL:-http://citra-minio:9000}
      # No prefix: the BUCKET is the bank's, so keys are claims/<id>/<doc>.
      BUCKET_KEY_PREFIX: ${ACME_BANK_BUCKET_PREFIX:-}
      DOCUMENT_URL_TTL_SECONDS: ${DOCUMENT_URL_TTL_SECONDS:-300}

      # ── Postgres (all 4 structured sources) ──────────────────────────
      # Each source's connection block declares env_prefix=ACME_BANK_SQL; the
      # connector reads ACME_BANK_SQL_HOST/_PORT/_DB/_USER/_PASS from here.
      # Reached by container name on the shared network, so the port is 5432
      # (the 15444 mapping is for the host only).
      PYTHONPATH: "/app/source-mcp-template"
      ACME_BANK_SQL_HOST: "citra-ds-acme-bank-postgres"
      ACME_BANK_SQL_PORT: "5432"
      ACME_BANK_SQL_DB: "acme_bank"
      ACME_BANK_SQL_USER: "acme_bank"
      ACME_BANK_SQL_PASS: "acme_bank_demo_pw"

      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

      PORT: "8090"
    healthcheck:
      # python:slim base — no curl, no wget. urllib one-liner instead.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  citra-ds-acme-bank-postgres:
    image: postgres:16-alpine
    container_name: citra-ds-acme-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acme_bank
      POSTGRES_USER: acme_bank
      POSTGRES_PASSWORD: acme_bank_demo_pw
    # 5443 belongs to acme-power. Dedicated container + dedicated port: at
    # cut-over acme-power's container is destroyed without touching this one.
    ports:
      - "15444:5432"
    volumes:
      - acme-bank-pgdata:/var/lib/postgresql/data
    networks:
      - citra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_bank"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Joins the platform network rather than standing up its own. This MCP is a
  # separate compose PROJECT (generated per tenant, own lifecycle) but it is
  # not a separate network: on its own network it could not resolve a single
  # service name and every URL below had to hairpin out through
  # host.docker.internal:<published port>, which is why each one carried a
  # paragraph explaining which port and why. external:true is honest here —
  # docker-compose.infra.yml creates it.
  citra-network:
    external: true
    name: citra-network

volumes:
  acme-bank-pgdata:
