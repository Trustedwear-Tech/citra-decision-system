# =============================================================================
# Citra AI Platform — CI Pipeline
# =============================================================================

name: CI

# Manual-only: this pipeline does NOT run automatically on push/PR.
# Trigger it from the Actions tab ("Run workflow") or `gh workflow run CI`.
on:
  # The README badge renders THIS workflow's last run. With only
  # workflow_dispatch it rendered whenever somebody last clicked, so a commit
  # that broke the build left a green badge up until the next manual run --
  # the badge asserted something it had not checked.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it; the
# older run's result is about code that is no longer main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # License Header Check
  # ---------------------------------------------------------------------------
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        run: |
          chmod +x scripts/add-headers.sh
          ./scripts/add-headers.sh --check

  # ---------------------------------------------------------------------------
  # Python Services — Lint & Test
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    strategy:
      # One failing entry must not cancel the rest: fail-fast hides their
      # real state behind 'cancelled', which reads as unknown and costs an
      # extra round trip per entry to uncover.
      fail-fast: false
      matrix:
        service:
          - Citra-Service
          - duckdb-query-service
          - reranker-service
          - playwright-render-service
          - Monitoring-Service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: pip install ruff
      - name: Lint
        run: ruff check ${{ matrix.service }}/ --select E,F,W --ignore E501
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Node.js Services — Lint
  # ---------------------------------------------------------------------------
  node-lint:
    name: Node.js Lint
    runs-on: ubuntu-latest
    strategy:
      # One failing entry must not cancel the rest: fail-fast hides their
      # real state behind 'cancelled', which reads as unknown and costs an
      # extra round trip per entry to uncover.
      fail-fast: false
      matrix:
        service:
          # The Node projects that are actually in this tree. Citra-User-Service
          # and citra-agent were both listed here and neither was carried over in
          # the OSS split, so the job could only fail with "No such file or
          # directory" -- and it took the whole matrix down with it. Nobody
          # noticed because this workflow is workflow_dispatch only.
          - Citra-UI
          - citra-app-runtime
          - bank-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci --ignore-scripts
      - name: Lint (if configured)
        working-directory: ${{ matrix.service }}
        run: npx eslint . --ext .js --no-error-on-unmatched-pattern || true

  # ---------------------------------------------------------------------------
  # Docker Build Verification
  # ---------------------------------------------------------------------------
  # Script permissions
  # ---------------------------------------------------------------------------
  script-perms:
    name: Script Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script with a shebang must be executable
        run: |
          # core.filemode is false on Windows, so a +x done there is never
          # recorded and every .sh in this repo silently landed as 100644.
          # `make wizard` runs ./scripts/quickstart/wizard.sh, so the entire
          # install failed with "Permission denied" on Linux and macOS while
          # working fine for the author, because MSYS ignores the bit.
          bad=0
          while read -r mode _ _ path; do
            case "$mode" in
              100755) continue ;;
            esac
            if head -1 "$path" 2>/dev/null | grep -q '^#!'; then
              echo "::error file=$path::has a shebang but is mode $mode - run: git update-index --chmod=+x $path"
              bad=1
            fi
          done < <(git ls-files -s '*.sh')
          [ "$bad" = 0 ] && echo "All shebang scripts are executable."
          exit "$bad"

  tree-hygiene:
    name: Tree Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No build output may be tracked
        run: |
          # Citra-UI/dist is a compiled web bundle. Dockerfile.web produces it
          # with `npx expo export --platform web` inside the build stage, and it
          # is gitignored in three places, so today nothing here is tracked.
          #
          # This exists for the day that changes. A committed bundle is minified
          # JavaScript for whatever happened to be in the tree when someone ran
          # the build -- so once a proprietary edition exists, it is a way for
          # enterprise code to reach the open repository without a single source
          # file being added to it. Nothing else would notice: the licence-header
          # check reads headers, and a bundle has none.
          #
          # A .gitignore does not prevent this. `git add -f` walks straight past
          # it, and so does an editor's "stage all". This does not.
          bad=$(git ls-files | grep -E '(^|/)(dist|build|\.next|\.expo)/' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while read -r path; do
              echo "::error file=$path::build output must not be tracked - it is gitignored and produced at image-build time"
            done
            echo
            echo "Build output is tracked. Remove it with:"
            echo "  git rm -r --cached <path>"
            exit 1
          fi
          echo "No build output is tracked."

  # ---------------------------------------------------------------------------
  # The images users actually build
  # ---------------------------------------------------------------------------
  compose-build:
    name: Compose Build (what make wizard runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the Compose version the README's install gives users
        run: |
          # The runner's bundled compose plugin is older than the one
          # get.docker.com installs, and rejects this repo's overlay:
          #
          #   services.minio conflicts with imported resource
          #
          # docker-compose.quickstart.yml deliberately `include`s the infra and
          # dev files and then re-declares 13 of their services to add
          # `env_file: [.env]`. Newer Compose treats that as an override; older
          # Compose treats it as a conflict. Testing against a version no user
          # is told to install would prove nothing, so CI installs the same one
          # the README does.
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64             -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Build the quickstart stack from source
        run: |
          # docker-build below builds the PROD Dockerfiles. `make wizard` builds
          # the .dev ones, via this compose file -- so until now the images every
          # user actually builds were tested by nothing.
          #
          # A clean-room install found the cost of that: twelve .dev Dockerfiles
          # shared one BuildKit pip cache at sharing=shared, and building them
          # concurrently made pip report a dependency conflict that did not
          # exist. Building one image at a time would NOT have caught it. This
          # job runs the real command, with the real parallelism, which is the
          # only thing that reproduces it.
          cp .env.example .env
          docker compose -f docker-compose.quickstart.yml build

  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      # One failing entry must not cancel the rest: fail-fast hides their
      # real state behind 'cancelled', which reads as unknown and costs an
      # extra round trip per entry to uncover.
      fail-fast: false
      matrix:
        include:
          - service: Citra-Service
            dockerfile: Dockerfile
          - service: duckdb-query-service
            dockerfile: Dockerfile
          - service: reranker-service
            dockerfile: Dockerfile
          - service: playwright-render-service
            dockerfile: Dockerfile
          - service: Monitoring-Service
            dockerfile: Dockerfile
            # The only one whose Dockerfile copies relative to ITSELF
            # (COPY requirements.txt . / COPY . .), so the repo root is the
            # wrong context for it and right for every other entry.
            context: Monitoring-Service
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          # Context is the REPO ROOT, not the service directory. Four of
          # these five Dockerfiles copy from paths that only exist at the
          # root (citra-common/citra-service-utils, Citra-Service/...), so a
          # service-scoped context failed with "/reranker-service: not
          # found" on a directory that is plainly there.
          # docker-compose.dev.yml builds all of them with `context: .`;
          # this now matches, and was checked by building one locally.
          # Docker repository names must be lowercase, and two of the five
          # service DIRECTORIES are capitalised (Citra-Service,
          # Monitoring-Service), so the tag cannot just interpolate the
          # matrix value -- it is lowercased here.
          tag="citra-$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]'):test"
          docker build -t "$tag" \
            -f ${{ matrix.service }}/${{ matrix.dockerfile }} \
            ${{ matrix.context || '.' }}

  # ---------------------------------------------------------------------------
  # Security Scanning
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Secret Scanning (prevent credential leaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks BINARY is free; gitleaks-action@v2 refuses to run for an
      # organisation without a paid licence key ("[org] is an organization.
      # License key is required."), which failed this job on every run and had
      # nothing to do with whether a secret was found. Running the CLI keeps
      # the scan and drops the licence wall.
      - name: Run Gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --redact so a finding never prints the secret into a public log.
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
