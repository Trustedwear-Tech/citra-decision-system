name: Build & Deploy Action-Sandbox-Host

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Target environment'
        options:
          - prod
          - test
        required: true
        default: 'test'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: action-sandbox-host

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          IMAGE=${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}

          docker build \
            -t ${IMAGE}:${{ inputs.environment }}-${{ github.sha }} \
            -t ${IMAGE}:${{ inputs.environment }}-latest \
            .

          docker push ${IMAGE}:${{ inputs.environment }}-${{ github.sha }}
          docker push ${IMAGE}:${{ inputs.environment }}-latest

  deploy:
    name: Deploy to Sandbox VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SANDBOX_HOST_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_NAME,ENVIRONMENT,GHCR_PAT
          command_timeout: 5m
          script: |
            set -e

            IMAGE="${IMAGE_PREFIX}/${IMAGE_NAME}"
            ENV="${ENVIRONMENT}"
            SERVICE_DIR="$HOME/Citra-AI/action-sandbox-host"

            echo "=== Deploying action-sandbox-host ($ENV) ==="

            echo "${GHCR_PAT}" | docker login ghcr.io -u github --password-stdin

            docker pull ${IMAGE}:${ENV}-latest
            docker tag ${IMAGE}:${ENV}-latest action-sandbox-host:latest

            cd ${SERVICE_DIR}

            docker compose up -d --no-build --force-recreate

            sleep 5
            curl -fsS http://127.0.0.1:7090/health || echo "WARNING: health check failed"

            docker image prune -f

            echo "=== Deploy complete ==="
