<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in...</title>
  <style>
    body {
      margin: 0;
      background: #0a0f1e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container { text-align: center; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Completing sign-in...</p>
  </div>
  <script>
    // Lightweight OAuth redirect handler for expo-web-browser popup flow.
    // This page replaces the full SPA that was loading inside the popup.
    // It mirrors the localStorage protocol from expo-web-browser's
    // maybeCompleteAuthSession() without loading React/Expo at all.
    (function () {
      try {
        var HANDLE_KEY = 'ExpoWebBrowserRedirectHandle';
        var handle = localStorage.getItem(HANDLE_KEY);

        if (!handle) {
          // No auth session in progress — redirect to home
          window.location.replace('/');
          return;
        }

        var url = window.location.href;

        // Store the callback URL so the parent window can pick it up
        // via AppState listener or polling (expo-web-browser fallback)
        localStorage.setItem('ExpoWebBrowser_OriginUrl_' + handle, url);

        // Try sending postMessage to opener (works when COOP allows it)
        var parent = window.opener || window.parent;
        if (parent && parent !== window) {
          try {
            parent.postMessage(
              { url: url, expoSender: handle },
              window.location.origin
            );
          } catch (e) {
            // COOP blocked — fall through to localStorage fallback
          }
        }

        // Try closing the popup window
        try { window.close(); } catch (e) {}

        // If window.close() was blocked, show a message after a short delay
        setTimeout(function () {
          document.querySelector('p').textContent =
            'Sign-in complete! You can close this window.';
        }, 1500);
      } catch (e) {
        // Safety net — redirect to main app
        window.location.replace('/');
      }
    })();
  </script>
</body>
</html>
