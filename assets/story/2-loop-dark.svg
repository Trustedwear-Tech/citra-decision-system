<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="One case at a time: recommend with evidence, let the officer decide, learn from the correction">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A3648"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B8DEF"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3FBFA9"/>
    </marker>
  </defs>
  <rect width="1200" height="350" fill="#0B1220"/>
  <text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#E6EDF6" text-anchor="start">So it learns that judgement, one case at a time.</text>
  <rect x="40" y="80" width="180" height="150" rx="10" fill="#111A2B" stroke="#243247" stroke-width="1.5"/>
  <text x="58" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#76839A" text-anchor="start">A CASE</text>
  <text x="58" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">Arrives from your</text>
  <text x="58" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">system of record.</text>
  <path d="M230,155 L267,155" stroke="#2A3648" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="275" y="80" width="180" height="150" rx="10" fill="#111A2B" stroke="#243247" stroke-width="1.5"/>
  <text x="293" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#76839A" text-anchor="start">IT RECOMMENDS</text>
  <text x="293" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">With the SOP passage</text>
  <text x="293" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">and past cases cited.</text>
  <path d="M465,155 L502,155" stroke="#2A3648" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="510" y="80" width="180" height="150" rx="10" fill="#16233A" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="528" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#5B8DEF" text-anchor="start">A PERSON DECIDES</text>
  <text x="528" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">Approves, or corrects it</text>
  <text x="528" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">and says why.</text>
  <path d="M700,155 L737,155" stroke="#5B8DEF" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <rect x="745" y="80" width="180" height="150" rx="10" fill="#16233A" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="763" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#5B8DEF" text-anchor="start">IT LEARNS</text>
  <text x="763" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">Three officers agreeing</text>
  <text x="763" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">makes it a rule.</text>
  <path d="M935,155 L972,155" stroke="#5B8DEF" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <rect x="980" y="80" width="180" height="150" rx="10" fill="#111A2B" stroke="#243247" stroke-width="1.5"/>
  <text x="998" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#76839A" text-anchor="start">NEXT CASE</text>
  <text x="998" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">The rule applies —</text>
  <text x="998" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#93A1B3" text-anchor="start">only where it fits.</text>
  <path d="M1070,240 L1070,286 L130,286 L130,240" stroke="#5B8DEF" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#ab)"/>
  <text x="600" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B8DEF" text-anchor="middle">every case makes the next one better</text>
  <text x="40" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#93A1B3" text-anchor="start">A judgement cites the corrections that formed it, applies only to cases like those, and can be retired when it stops being true.</text>
</svg>
