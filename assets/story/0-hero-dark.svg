<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-label="Citra Decision System: judgement compounds, and you build apps, APIs and embedded UI by describing them">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A3648"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B8DEF"/>
    </marker>
  </defs>
  <rect width="1240" height="430" fill="#0B1220"/>
<line x1="620" y1="34" x2="620" y2="400" stroke="#2A3648" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#76839A" text-anchor="start">IT LEARNS FROM YOUR PEOPLE</text>
  <text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF6" text-anchor="start">Judgement compounds</text>
  <rect x="40" y="122" width="116" height="62" rx="10" fill="#111A2B" stroke="#243247" stroke-width="1.5"/>
  <text x="98" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#E6EDF6" text-anchor="middle">A case</text>
  <text x="98" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#93A1B3" text-anchor="middle">arrives</text>
  <path d="M160,153.0 L196,153.0" stroke="#2A3648" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="198" y="122" width="148" height="62" rx="10" fill="#16233A" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="272" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Recommendation</text>
  <text x="272" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#2563EB" text-anchor="middle">with its citation</text>
  <path d="M350,153.0 L386,153.0" stroke="#2A3648" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="388" y="122" width="148" height="62" rx="10" fill="#2A2413" stroke="#F0B429" stroke-width="1.5"/>
  <text x="462" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#F0B429" text-anchor="middle">An officer</text>
  <text x="462" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#F0B429" text-anchor="middle">corrects it</text>
<path d="M462 184 L462 226" stroke="#2A3648" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="474" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#76839A" text-anchor="start">three officers agree</text>
  <rect x="300" y="236" width="236" height="58" rx="10" fill="#122A29" stroke="#3FBFA9" stroke-width="1.5"/>
  <text x="418" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#3FBFA9" text-anchor="middle">becomes a rule</text>
  <text x="418" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#3FBFA9" text-anchor="middle">written down, cited, reversible</text>
<path d="M300 265 L98 265 L98 192" stroke="#3FBFA9" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <text x="112" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#3FBFA9" text-anchor="start">the next case uses it</text>
  <text x="40" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#93A1B3" text-anchor="start">Nothing is learned from a single opinion.</text>
  <text x="40" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#93A1B3" text-anchor="start">Agreement is the bar, and every rule says who set it.</text>
  <text x="660" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#76839A" text-anchor="start">AND YOU BUILD IT BY DESCRIBING IT</text>
  <text x="660" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EDF6" text-anchor="start">Describe it, and it builds</text>
  <rect x="660" y="108" width="520" height="52" rx="10" fill="#111A2B" stroke="#243247" stroke-width="1.5"/>
  <text x="676" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#E6EDF6" text-anchor="start">“Triage motor claims: flag anything over $50,000</text>
  <text x="676" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#E6EDF6" text-anchor="start">  or a repeat claimant, and say why.”</text>
<path d="M920 162 L920 178" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
<path d="M746 178 L1094 178" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
