<path d="M920 178 L920 188" stroke="#5B8DEF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
<path d="M1094 178 L1094 188" stroke="#5B8DEF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <rect x="674" y="196" width="144" height="30" rx="15" fill="#16233A" stroke="#5B8DEF" stroke-width="1.2"/>
  <text x="746.0" y="215.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2563EB" text-anchor="middle">Decision App</text>
  <rect x="874" y="196" width="92" height="30" rx="15" fill="#16233A" stroke="#5B8DEF" stroke-width="1.2"/>
  <text x="920.0" y="215.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2563EB" text-anchor="middle">API</text>
  <rect x="1018" y="196" width="152" height="30" rx="15" fill="#16233A" stroke="#5B8DEF" stroke-width="1.2"/>
  <text x="1094.0" y="215.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2563EB" text-anchor="middle">Embedded UI</text>
<path d="M746 226 L746 242" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
<path d="M920 226 L920 242" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
<path d="M1094 226 L1094 242" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
<path d="M746 242 L1094 242" stroke="#5B8DEF" stroke-width="1.6" fill="none"/>
<path d="M920 242 L920 256" stroke="#5B8DEF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <rect x="660" y="258" width="520" height="74" rx="10" fill="#16233A" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="920" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#2563EB" text-anchor="middle">your database, described once</text>
  <text x="920" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#2563EB" text-anchor="middle">point it at one you have, or stand a new one up —</text>
  <text x="920" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#2563EB" text-anchor="middle">`make ontology` interviews it and writes the rulebook</text>
  <text x="660" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#93A1B3" text-anchor="start">Claims triage · loan origination · asset-quality review ·</text>
  <text x="660" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#93A1B3" text-anchor="start">grievance routing · an operations dashboard.</text>
