<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Citra Decision System — the decision system that learns human judgement">
  <defs>
    <linearGradient id="markd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ruled" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".7"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="#0B1220"/>

  <!-- faint decision lattice, right side -->
  <g stroke="#E6EDF6" stroke-opacity=".085" stroke-width="1">
    <path d="M1000 58 v46 M1000 104 l-42 26 M1000 104 l42 26"/>
    <path d="M1108 58 v46 M1108 104 l-42 26 M1108 104 l42 26"/>
  </g>
  <g fill="#E6EDF6" fill-opacity=".11">
    <circle cx="1000" cy="58" r="5"/><circle cx="958" cy="130" r="4"/><circle cx="1042" cy="130" r="4"/>
    <circle cx="1108" cy="58" r="5"/><circle cx="1066" cy="130" r="4"/><circle cx="1150" cy="130" r="4"/>
  </g>

  <!-- brand mark: the OpsMark decision glyph -->
  <g transform="translate(96 112) scale(3.4)">
    <path d="M20 4 L32.1 11 V25 L20 32 L7.9 25 V11 Z" fill="none" stroke="url(#markd)" stroke-width="2.1" stroke-linejoin="round" opacity=".65"/>
    <circle cx="20" cy="18" r="3.3" fill="url(#markd)"/>
    <path d="M20 21.3 V26 M20 26 L14 29.5 M20 26 L26 29.5" fill="none" stroke="url(#markd)" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="14" cy="29.5" r="1.9" fill="url(#markd)"/>
    <circle cx="26" cy="29.5" r="1.9" fill="url(#markd)"/>
  </g>

  <!-- wordmark + promise -->
  <text x="264" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#F2F5F8">Citra Decision System</text>
  <text x="266" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" fill="#B7C2D0">The decision system that learns human judgement.</text>

  <rect x="266" y="228" width="300" height="2" fill="url(#ruled)"/>

  <text x="266" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.3" fill="#93A1B3">GROUNDED IN YOUR DATA · GOVERNED BY YOUR RULES · RUNS ON YOUR INFRASTRUCTURE</text>
  <text x="266" y="306" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#76839A">Banking · insurance · energy · logistics · public services — wherever a high-stakes call still needs a human.</text>
</svg>
